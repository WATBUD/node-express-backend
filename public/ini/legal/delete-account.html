<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>刪除 INI Dating 帳號</title>
  <style>body{margin:0;background:#fff8f8;color:#3b3134;font:16px/1.75 system-ui,sans-serif}main{max-width:720px;margin:auto;padding:36px 22px}h1,h2{color:#d94f69}.card{background:#fff;padding:20px;border-radius:16px;border:1px solid #f1dfe2}a.button{display:inline-block;margin-top:12px;padding:11px 18px;border-radius:24px;background:#ed5b75;color:white;text-decoration:none}</style>
</head>
<body><main>
  <h1>刪除 INI Dating 帳號與資料</h1>
  <div class="card">
    <h2>在 App 內立即刪除</h2>
    <ol><li>登入 INI Dating。</li><li>開啟「Profile」，點右上角齒輪。</li><li>選擇「刪除帳號」，輸入目前密碼並確認。</li></ol>
    <p>確認後，帳號、個人檔案、語音、邀請、好友關係及聊天資料會永久刪除，無法復原。依法必須保存的安全或交易紀錄除外。</p>
    <h2>無法登入時</h2>
    <p>使用註冊 Email 寄信，主旨填寫「刪除 INI Dating 帳號」，並提供註冊 Email。完成身分核對後處理。</p>
    <a class="button" href="mailto:ini.dating.verify@gmail.com?subject=%E5%88%AA%E9%99%A4%20INI%20Dating%20%E5%B8%B3%E8%99%9F">寄送刪除申請</a>
  </div>
</main></body></html>
